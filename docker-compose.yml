# Local stack mirroring the Railway deployment: api (2 replicas behind compose DNS), workers, Redis, MinIO bucket.
#   docker compose up --build            http://localhost:8080
#   docker compose up --scale worker=3   more workers
x-backend: &backend
  build: .
  environment: &env
    REDIS_URL: redis://redis:6379/0
    SPHEREX_BUCKET: spherex-results
    SPHEREX_BUCKET_ENDPOINT: http://minio:9000
    SPHEREX_BUCKET_URL_STYLE: path
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_DEFAULT_REGION: us-east-1
  depends_on:
    redis: {condition: service_healthy}
    bucket-init: {condition: service_completed_successfully}

services:
  api:
    <<: *backend
    environment: {<<: *env, SPHEREX_ROLE: api, WEB_CONCURRENCY: "2"}
    ports: ["8080:8080"]
  worker:
    <<: *backend
    environment: {<<: *env, SPHEREX_ROLE: worker, SPHEREX_JOBS_PER_WORKER: "2"}
    deploy: {replicas: 2}
    stop_grace_period: 30s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 2s, retries: 20}
  bucket-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["sh", "-c", "mc alias set m http://minio:9000 minioadmin minioadmin && mc mb -p m/spherex-results"]
